<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDTuBe</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f0f0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: #0f0f0f !important;
            padding: 12px 24px;
            border-bottom: 1px solid #272727;
        }
        .navbar .logo {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;
        }
        .navbar .logo i {
            color: #ff0000;
            margin-right: 8px;
        }
        .navbar .search-box {
            display: flex;
            align-items: center;
            background: #121212;
            border: 1px solid #303030;
            border-radius: 40px;
            padding: 2px;
            max-width: 500px;
            width: 100%;
        }
        .navbar .search-box input {
            background: transparent;
            border: none;
            padding: 8px 16px;
            color: #fff;
            width: 100%;
            outline: none;
            font-size: 14px;
        }
        .navbar .search-box input::placeholder {
            color: #888;
        }
        .navbar .search-box button {
            background: #222;
            border: none;
            border-radius: 0 40px 40px 0;
            padding: 8px 20px;
            color: #aaa;
            cursor: pointer;
        }
        .navbar .search-box button:hover {
            background: #333;
        }
        .navbar .right-icons {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .navbar .right-icons i {
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        .navbar .right-icons .avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #555;
            cursor: pointer;
            object-fit: cover;
        }

        .channel-header {
            max-width: 1300px;
            margin: 80px auto 0;
            padding: 20px 24px 0;
        }
        .channel-info {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 0 24px;
            flex-wrap: wrap;
        }
        .channel-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #0f0f0f;
            background: #2a2a2a;
            object-fit: cover;
            flex-shrink: 0;
        }
        .channel-name {
            color: #fff;
            font-size: 26px;
            font-weight: 700;
        }
        .channel-handle {
            color: #aaa;
            font-size: 14px;
        }
        .channel-stats {
            color: #aaa;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .channel-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .subscribe-btn {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: auto;
        }
        .subscribe-btn:hover {
            background: #cc0000;
        }
        .subscribe-btn.subscribed {
            background: #272727;
            color: #aaa;
        }
        .subscribe-btn.subscribed:hover {
            background: #3a3a3a;
        }

        .channel-tabs {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px;
            border-bottom: 1px solid #272727;
            display: flex;
            gap: 32px;
            margin-top: 12px;
        }
        .channel-tabs a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 16px 0;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }
        .channel-tabs a:hover {
            color: #fff;
        }
        .channel-tabs a.active {
            color: #fff;
            border-bottom-color: #ff0000;
        }

        .controls {
            max-width: 1300px;
            margin: 0 auto;
            padding: 12px 24px 0;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .controls .btn-control {
            background: #272727;
            color: #aaa;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls .btn-control:hover {
            background: #3a3a3a;
            color: #fff;
        }
        .controls .btn-control i {
            font-size: 14px;
        }

        .video-grid {
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: transparent;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .video-card:hover {
            transform: scale(1.03);
        }

        .video-card .thumbnail {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
            aspect-ratio: 16/9;
        }

        .video-card .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-card .thumbnail .hover-play {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 12px;
        }

        .video-card:hover .thumbnail .hover-play {
            opacity: 1;
        }

        .video-card .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 2;
        }

        .video-card .thumbnail .play-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 3;
        }

        .video-card:hover .thumbnail .play-hint {
            opacity: 1;
        }

        .video-card .video-info {
            padding: 10px 4px 0;
            display: flex;
            gap: 12px;
        }
        .video-card .video-info .mini-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #333;
            flex-shrink: 0;
            object-fit: cover;
        }
        .video-card .video-info .details {
            flex: 1;
        }
        .video-card .video-info .details .title {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-card .video-info .details .channel-name {
            color: #aaa;
            font-size: 13px;
            margin-top: 4px;
        }
        .video-card .video-info .details .meta {
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .channel-info {
                flex-direction: column;
                align-items: flex-start;
            }
            .channel-avatar {
                width: 80px;
                height: 80px;
            }
            .channel-name {
                font-size: 20px;
            }
            .subscribe-btn {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
            .channel-tabs {
                gap: 16px;
                overflow-x: auto;
            }
            .channel-tabs a {
                font-size: 13px;
                white-space: nowrap;
            }
            .video-grid {
                grid-template-columns: 1fr;
                padding: 12px;
            }
            .navbar .search-box {
                max-width: 160px;
            }
            .navbar .search-box input {
                font-size: 12px;
                padding: 6px 10px;
            }
            .navbar .search-box button {
                padding: 6px 12px;
            }
            .controls {
                padding: 12px 12px 0;
                justify-content: center;
            }
            .controls .btn-control {
                font-size: 12px;
                padding: 6px 14px;
            }
        }
        @media (min-width: 769px) and (max-width: 1024px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1025px) and (max-width: 1300px) {
            .video-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- ===== НАВБАР ===== -->
    <nav class="navbar fixed-top">
        <a href="#" class="logo"><i class="fab fa-youtube"></i>GDTuBe</a>

        <div class="search-box">
            <input type="text" placeholder="Поиск...">
            <button><i class="fas fa-search"></i></button>
        </div>

        <div class="right-icons">
            <i class="fas fa-bell"></i>
            <img src="https://i.pinimg.com/736x/2e/99/2d/2e992d1138c6f58ea28151f874b0a5cf.jpg" alt="avatar" class="avatar-small" onerror="this.style.background='#555'">

    <!-- ===== ШАПКА КАНАЛА ===== -->

            <div>
                <div class="channel-name">nar1</div>

                    <span><i class="fas fa-users"></i> <span id="subsDisplay"></span> подписчиков</span>

            <button class="subscribe-btn" id="subscribeBtn">Подписаться</button>

    </div>

    <!-- ===== ВКЛАДКИ ===== -->
    <div class="channel-tabs">
        <a href="#" class="active">Видео</a>
        <a href="#">Плейлисты</a>
        <a href="#">Shorts</a>
        <a href="#">О канале</a>

    <!-- ===== КНОПКИ УПРАВЛЕНИЯ ===== -->
    <div class="controls">
        <button class="btn-control" id="refreshViewsBtn"><i class="fas fa-sync-alt"></i> Рандом просмотры</button>
        <button class="btn-control" id="refreshSubsBtn"><i class="fas fa-users"></i> Рандом подписчики</button>
    </div>

    <!-- ===== СЕТКА ВИДЕО ===== -->
    <div class="video-grid">

<!-- ВИДЕО 3: Orbit 77% (ID: 3MDRkXsz62Q) -->
<div class="video-card" onclick="window.open('https://www.youtube.com/watch?v=3MDRkXsz62Q', '_blank')">
    <div class="thumbnail">
        <img src="https://img.youtube.com/vi/3MDRkXsz62Q/hqdefault.jpg" alt="Orbit 77%">
        <span class="play-hint"><i class="fas fa-play"></i> Смотреть</span>
        <span class="duration">0:22</span>
    </div>
    <div class="video-info">
        <img src="https://i.pinimg.com/736x/2e/99/2d/2e992d1138c6f58ea28151f874b0a5cf.jpg" alt="avatar" class="mini-avatar" onerror="this.style.background='#444'">
        <div class="details">
            <div class="title">🔥 ORBIT 77% // РЕАКЦИЯ ПОСЛЕ СЛИВА</div>
            <div class="channel-name">nar1</div>
            <div class="meta" id="views3"></div>
        </div>

</div>

    </div>

    <!-- ===== СКРИПТЫ ===== -->
    <script>
        // ===== ПОДПИСКА =====
        document.getElementById('subscribeBtn').addEventListener('click', function() {
            this.classList.toggle('subscribed');
            if (this.textContent === 'Подписаться') {
                this.textContent = 'Вы подписаны';
            } else {
                this.textContent = 'Подписаться';
            }
        });

        // ===== СОХРАНЕНИЕ В LOCALSTORAGE =====
        function saveData(key, data) {
            localStorage.setItem('gdtube_' + key, JSON.stringify(data));
        }

        function loadData(key, fallback) {
            const saved = localStorage.getItem('gdtube_' + key);
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    return fallback;
                }
            }
            return fallback;
        }

        // ===== РАНДОМНЫЕ ПРОСМОТРЫ =====
        function randomViews() {
            const formats = [
                () => (Math.floor(Math.random() * 9) + 1) + '.' + Math.floor(Math.random() * 9) + ' тыс. просмотров',
                () => Math.floor(Math.random() * 9) + Math.floor(Math.random() * 9) + '.' + Math.floor(Math.random() * 9) + ' тыс. просмотров',
                () => Math.floor(Math.random() * 9) + Math.floor(Math.random() * 9) + Math.floor(Math.random() * 9) + '.' + Math.floor(Math.random() * 9) + ' тыс. просмотров',
                () => (Math.floor(Math.random() * 9) + 1) + '.' + Math.floor(Math.random() * 9) + ' млн просмотров'
            ];
            return formats[Math.floor(Math.random() * formats.length)]();
        }

        function randomDays() {
            const days = [
                'сегодня', '1 день назад', '2 дня назад', '3 дня назад',
                '4 дня назад', '5 дней назад', '6 дней назад',
                '1 неделю назад', '2 недели назад', '3 недели назад'
            ];
            return days[Math.floor(Math.random() * days.length)];
        }

        function generateViewsData() {
            return {
                views1: randomViews() + ' • ' + randomDays(),
                views2: randomViews() + ' • ' + randomDays(),
                views3: randomViews() + ' • ' + randomDays()
            };
        }

        function updateViews() {
            const data = generateViewsData();
            saveData('views', data);

            document.getElementById('views1').textContent = data.views1;
            document.getElementById('views2').textContent = data.views2;
            document.getElementById('views3').textContent = data.views3;
        }

        // ===== РАНДОМНЫЕ ПОДПИСЧИКИ (от 1.0 тыс. до 9.9 млн) =====
        function randomSubscribers() {
            const rand = Math.random();
            if (rand < 0.7) {
                const num = Math.floor(Math.random() * 999000) + 1000;
                return (num / 1000).toFixed(1).replace('.0', '') + ' тыс.';
            } else {
                return (Math.random() * 8.9 + 1).toFixed(1) + ' млн';
            }
        }

        function updateSubscribers() {
            const val = randomSubscribers();
            saveData('subs', val);
            document.getElementById('subsDisplay').textContent = val;
        }

        // ===== ЗАГРУЗКА СОХРАНЁННЫХ ДАННЫХ =====
        function loadAllData() {
            const views = loadData('views', null);
            if (views) {
                document.getElementById('views1').textContent = views.views1;
                document.getElementById('views2').textContent = views.views2;
                document.getElementById('views3').textContent = views.views3;
            } else {
                updateViews();
            }

            const subs = loadData('subs', null);
            if (subs) {
                document.getElementById('subsDisplay').textContent = subs;
            } else {
                updateSubscribers();
            }
        }

        // ===== ЗАПУСК =====
        loadAllData();

        // ===== КНОПКИ =====
        document.getElementById('refreshViewsBtn').addEventListener('click', function() {
            updateViews();
            const icon = this.querySelector('i');
            icon.style.transition = 'transform 0.5s';
            icon.style.transform = 'rotate(360deg)';
            setTimeout(() => { icon.style.transform = 'rotate(0deg)'; }, 500);
        });

        document.getElementById('refreshSubsBtn').addEventListener('click', function() {
            updateSubscribers();
            const icon = this.querySelector('i');
            icon.style.transition = 'transform 0.5s';
            icon.style.transform = 'rotate(360deg)';
            setTimeout(() => { icon.style.transform = 'rotate(0deg)'; }, 500);
        });
    </script>

</body>
</html>
