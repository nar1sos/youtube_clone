<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои прогрессы</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #0f0f0f !important;
        }
        .video-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .video-card:hover {
            transform: scale(1.02);
        }
        .video-card img {
            width: 100%;
        }
        .video-card .card-title {
            color: #fff;
            font-weight: 500;
        }
        .video-card .video-stats {
            color: #aaa;
            font-size: 14px;
        }
        .video-card .channel-icon img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }
        .navbar {
            background: #1a1a1a !important;
            border-bottom: 1px solid #333;
        }
        #logo {
            color: #fff !important;
        }
        .sidebar {
            background: #1a1a1a;
        }
        .sidebar .nav-link {
            color: #aaa;
        }
        .sidebar .nav-link:hover {
            background: #333;
            color: #fff;
        }
        .sidebar .nav-link.active {
            color: #fff;
            background: #333;
        }
        .sidebar .nav-link i {
            color: #aaa;
        }
        .sidebar .nav-link.active i {
            color: #fff;
        }
        .sidebar .text-muted {
            color: #666 !important;
        }
        .theme-toggle {
            color: #fff;
            border: none;
            background: transparent;
        }
        #video-create a {
            color: #fff !important;
        }
        #icon-button2, #icon-button3 {
            color: #fff !important;
        }
        .nav-footer a {
            color: #666 !important;
        }
        .search-bar input {
            background: #121212;
            border-color: #333;
            color: #fff;
        }
        .search-bar input::placeholder {
            color: #666;
        }
        .search-bar button {
            background: #222;
            border-color: #333;
            color: #aaa;
        }
        .search-bar button:hover {
            background: #333;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-light fixed-top border-bottom">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <button class="btn text-white" type="button" id="toggleButton1">
                    <i class="fa fa-bars"></i>
                </button>
                <a class="navbar-brand ms-3 d-flex align-items-center" href="index.html">
                    <span class="h3 mb-0 ms-1 text-white" id="logo">🎯 My Progress</span>
                </a>
            </div>
            
            <div class="search-bar mx-auto search-bar-big">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Search">
                    <button class="btn btn-outline-secondary" type="button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex align-items-center">
                <button class="theme-toggle fs-4" id="themeToggle">
                    <i class="fas fa-sun" id="themeIcon"></i>
                </button>   
                <button class="btn fs-4 text-white" type="button">
                    <i class="fa-regular fa-circle-user"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar border-end">
        <nav class="nav flex-column">
            <a class="nav-link active" href="index.html">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a class="nav-link" href="#">
                <i class="fas fa-trophy"></i>
                <span>Прогрессы</span>
            </a>
            <hr>
            <a class="nav-link" href="#">
                <i class="fas fa-history"></i>
                <span>История</span>
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <div class="row g-4">
                
                <!-- ТВОЁ ВИДЕО - ORBIT 77% -->
                <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
                    <div class="video-card">
                        <a href="https://www.youtube.com/watch?v=ТВОЙ_ID_ВИДЕО" class="text-decoration-none text-dark">
                            <img src="https://img.youtube.com/vi/ТВОЙ_ID_ВИДЕО/maxresdefault.jpg" class="card-img-top" alt="Orbit 77%">
                            <div class="card-body p-2">
                                <div class="d-flex mt-2">
                                    <div class="channel-icon me-2">
                                        <img src="https://img.youtube.com/vi/ТВОЙ_ID_ВИДЕО/hqdefault.jpg" alt="">
                                    </div>
                                    <div>
                                        <h6 class="card-title mb-1">🔥 ORBIT 77% // Fluked from 40%</h6>
                                        <p class="card-text video-stats mb-0">ТвойНик</p>
                                        <p class="card-text video-stats">1.2 тыс. просмотров • 2 дня назад</p>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggleButton = document.querySelector('#toggleButton1').parentElement;
            const sidebar = document.querySelector('.sidebar');
            const mainContent = document.querySelector('.main-content');
            
            if (window.innerWidth < 768) {
                mainContent.classList.add('expanded');
            }
            
            toggleButton.addEventListener('click', function() {
                if (window.innerWidth < 768) {
                    sidebar.classList.toggle('show');
                } else {
                    sidebar.classList.toggle('collapsed');
                    mainContent.classList.toggle('expanded');
                }
            });
            
            window.addEventListener('resize', function() {
                if (window.innerWidth >= 768) {
                    sidebar.classList.remove('show');
                    if (!sidebar.classList.contains('collapsed')) {
                        mainContent.classList.remove('expanded');
                    }
                } else {
                    sidebar.classList.remove('collapsed');
                    mainContent.classList.add('expanded');
                }
            });
        });
    </script>
</body>
</html>
        </script>
    </body>
    </html>
