<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой канал</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f0f0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ---- Навбар ---- */
        .navbar {
            background: #0f0f0f !important;
            padding: 12px 24px;
            border-bottom: 1px solid #272727;
        }
        .navbar .logo {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;
        }
        .navbar .logo i {
            color: #ff0000;
            margin-right: 8px;
        }
        .navbar .search-box {
            display: flex;
            align-items: center;
            background: #121212;
            border: 1px solid #303030;
            border-radius: 40px;
            padding: 2px;
            max-width: 500px;
            width: 100%;
        }
        .navbar .search-box input {
            background: transparent;
            border: none;
            padding: 8px 16px;
            color: #fff;
            width: 100%;
            outline: none;
            font-size: 14px;
        }
        .navbar .search-box input::placeholder {
            color: #888;
        }
        .navbar .search-box button {
            background: #222;
            border: none;
            border-radius: 0 40px 40px 0;
            padding: 8px 20px;
            color: #aaa;
            cursor: pointer;
        }
        .navbar .search-box button:hover {
            background: #333;
        }
        .navbar .right-icons {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .navbar .right-icons i {
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        .navbar .right-icons .avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #555;
            cursor: pointer;
        }

        /* ---- Канал (шапка) ---- */
        .channel-header {
            max-width: 1300px;
            margin: 80px auto 0;
            padding: 20px 24px 0;
        }
        .channel-banner {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }
        .channel-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .channel-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: -40px;
            padding: 0 24px;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
        }
        .channel-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #0f0f0f;
            background: #2a2a2a;
            object-fit: cover;
            flex-shrink: 0;
        }
        .channel-name {
            color: #fff;
            font-size: 26px;
            font-weight: 700;
        }
        .channel-handle {
            color: #aaa;
            font-size: 14px;
        }
        .channel-stats {
            color: #aaa;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .channel-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .subscribe-btn {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: auto;
        }
        .subscribe-btn:hover {
            background: #cc0000;
        }
        .subscribe-btn.subscribed {
            background: #272727;
            color: #aaa;
        }
        .subscribe-btn.subscribed:hover {
            background: #3a3a3a;
        }

        /* ---- Вкладки ---- */
        .channel-tabs {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px;
            border-bottom: 1px solid #272727;
            display: flex;
            gap: 32px;
            margin-top: 12px;
        }
        .channel-tabs a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 16px 0;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }
        .channel-tabs a:hover {
            color: #fff;
        }
        .channel-tabs a.active {
            color: #fff;
            border-bottom-color: #ff0000;
        }

        /* ---- Сетка видео ---- */
        .video-grid {
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: transparent;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.2s;
            cursor: pointer;
        }
        .video-card:hover {
            transform: scale(1.02);
        }
        .video-card .thumbnail {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
        }
        .video-card .thumbnail img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }
        .video-card .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .video-card .video-info {
            padding: 10px 4px 0;
            display: flex;
            gap: 12px;
        }
        .video-card .video-info .mini-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #333;
            flex-shrink: 0;
            object-fit: cover;
        }
        .video-card .video-info .details {
            flex: 1;
        }
        .video-card .video-info .details .title {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-card .video-info .details .channel-name {
            color: #aaa;
            font-size: 13px;
            margin-top: 4px;
        }
        .video-card .video-info .details .meta {
            color: #888;
            font-size: 13px;
        }

        /* ---- Адаптив ---- */
        @media (max-width: 768px) {
            .channel-info {
                flex-direction: column;
                align-items: flex-start;
                margin-top: -30px;
            }
            .channel-avatar {
                width: 80px;
                height: 80px;
            }
            .channel-name {
                font-size: 20px;
            }
            .subscribe-btn {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
            .channel-tabs {
                gap: 16px;
                overflow-x: auto;
            }
            .channel-tabs a {
                font-size: 13px;
                white-space: nowrap;
            }
            .video-grid {
                grid-template-columns: 1fr;
                padding: 12px;
            }
            .navbar .search-box {
                max-width: 160px;
            }
            .navbar .search-box input {
                font-size: 12px;
                padding: 6px 10px;
            }
            .navbar .search-box button {
                padding: 6px 12px;
            }
        }
        @media (min-width: 769px) and (max-width: 1024px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1025px) and (max-width: 1300px) {
            .video-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- ===== НАВБАР ===== -->
    <nav class="navbar fixed-top">
        <a href="#" class="logo"><i class="fab fa-youtube"></i>GDTuBe</a>

        <div class="search-box">
            <input type="text" placeholder="Поиск...">
            <button><i class="fas fa-search"></i></button>
        </div>

        <div class="right-icons">
            <i class="fas fa-bell"></i>
            <img src="assets/avatar.jpg" alt="avatar" class="avatar-small" onerror="this.style.background='#555'">
        </div>
    </nav>

    <!-- ===== ШАПКА КАНАЛА ===== -->
    <div class="channel-header">
        <!-- Баннер -->
        <div class="channel-banner">
            <img src="assets/banner.jpg" alt="banner" onerror="this.style.display='none'">
        </div>

        <!-- Инфо -->
        <div class="channel-info">
            <img src="assets/avatar.jpg" alt="avatar" class="channel-avatar" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23333%22/%3E%3Ccircle cx=%2250%22 cy=%2235%22 r=%2220%22 fill=%22%23555%22/%3E%3Ccircle cx=%2250%22 cy=%2275%22 r=%2225%22 fill=%22%23555%22/%3E%3C/svg%3E'">

            <div>
                <div class="channel-name">nar1</div>
                <div class="channel-handle">@nar1gd</div>
                <div class="channel-stats">
                    <span><i class="fas fa-users"></i> 59 подписчиков</span>
                    <span style="margin-left:12px;"><i class="fas fa-video"></i> 1 видео</span>
                </div>
            </div>

            <button class="subscribe-btn" id="subscribeBtn">Подписаться</button>
        </div>
    </div>

    <!-- ===== ВКЛАДКИ ===== -->
    <div class="channel-tabs">
        <a href="#" class="active">Видео</a>
        <a href="#">Плейлисты</a>
        <a href="#">Shorts</a>
        <a href="#">О канале</a>
    </div>

    <!-- ===== СЕТКА ВИДЕО ===== -->
    <div class="video-grid">

        <!-- ВИДЕО 1: Orbit 77% -->
        <div class="video-card" onclick="window.open('https://www.youtube.com/watch?v=', '_blank')">
            <div class="thumbnail">
                <img src="https://img.youtube.com/vi/3MDRkXsz62Q/maxresdefault.jpg" alt="Orbit 77%">
                <span class="duration">0:22</span>
            </div>
            <div class="video-info">
                <img src="assets/avatar.jpg" alt="avatar" class="mini-avatar" onerror="this.style.background='#444'">
                <div class="details">
                    <div class="title">🔥ORBIT 77% // ФИНАЛЬНАЯ РЕАКЦИЯ</div>
                    <div class="channel-name">nar1gd</div>
                    <div class="meta">1.2 тыс. просмотров</div>
                </div>
            </div>
        </div>

        <!-- ===== ДОБАВЛЯЙ НОВЫЕ ВИДЕО ЗДЕСЬ ===== -->

        <div class="video-card" onclick="window.open('https://www.youtube.com/watch?v=ID_ВИДЕО', '_blank')">
            <div class="thumbnail">
                <img src="https://img.youtube.com/vi/ID_ВИДЕО/maxresdefault.jpg" alt="Название">
                <span class="duration">3:45</span>
            </div>
            <div class="video-info">
                <img src="assets/avatar.jpg" alt="avatar" class="mini-avatar">
                <div class="details">
                    <div class="title">НАЗВАНИЕ ВИДЕО</div>
                    <div class="channel-name">ТвойНик</div>
                    <div class="meta">просмотров • дата</div>
                </div>
            </div>
        </div>
        -->

    </div>

    <!-- ===== СКРИПТЫ ===== -->
    <script>
        // Кнопка подписки
        document.getElementById('subscribeBtn').addEventListener('click', function() {
            this.classList.toggle('subscribed');
            if (this.textContent === 'Подписаться') {
                this.textContent = 'Вы подписаны';
            } else {
                this.textContent = 'Подписаться';
            }
        });
    </script>

</body>
